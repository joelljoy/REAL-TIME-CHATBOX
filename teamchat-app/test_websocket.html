<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #messages { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin: 10px 0; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <div>
        <input type="text" id="roomInput" placeholder="Room name" value="test">
        <input type="text" id="userInput" placeholder="Username" value="testuser">
        <input type="text" id="initialsInput" placeholder="Initials" value="TU">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>
    <div>
        <input type="text" id="messageInput" placeholder="Message">
        <button onclick="sendMessage()">Send</button>
    </div>
    <div id="status">Not connected</div>
    <div id="messages"></div>

    <script>
        let ws = null;

        function connect() {
            const room = document.getElementById('roomInput').value;
            const username = document.getElementById('userInput').value;
            const initials = document.getElementById('initialsInput').value;
            
            const wsUrl = `ws://localhost:8000/ws/${encodeURIComponent(room)}/${encodeURIComponent(username)}/${encodeURIComponent(initials)}`;
            
            document.getElementById('status').textContent = 'Connecting...';
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                document.getElementById('status').textContent = 'Connected!';
                addMessage('Connected to WebSocket');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                addMessage('Received: ' + JSON.stringify(data, null, 2));
            };
            
            ws.onerror = function(error) {
                document.getElementById('status').textContent = 'Error: ' + error;
                addMessage('Error: ' + error);
            };
            
            ws.onclose = function() {
                document.getElementById('status').textContent = 'Disconnected';
                addMessage('Disconnected');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendMessage() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const text = document.getElementById('messageInput').value;
                ws.send(JSON.stringify({
                    type: 'message',
                    content: text
                }));
                addMessage('Sent: ' + text);
            }
        }

        function addMessage(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
    </script>
</body>
</html>
